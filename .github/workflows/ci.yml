name: CI

on:
  push:
  pull_request:

jobs:
  python-and-web:
    strategy:
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install uv==0.13.9
      - run: uv sync --locked
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -c "from miio.miot_device import MiotDevice"
      - run: ruff check .
      - run: mypy miot_base.py tooling.py
      - run: python -m compileall -q -x "/[.]venv/" .
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: npm ci --prefix tests/browser
      - run: node --test tests/browser/*.test.cjs

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tuch_controller/render_preview.py

  firmware-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: cp tuch_controller/secrets.h.example tuch_controller/secrets.h
      - run: platformio run
